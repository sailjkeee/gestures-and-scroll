name: macOS build and checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run input and profile checks
        run: ./check.sh
      - name: Build the app
        run: ./build.sh
